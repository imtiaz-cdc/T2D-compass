name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
      - name: Install Python
        run: uv python install 3.12
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run python -m ruff check src tests main.py scripts/build_bundles.py scripts/collect_type2diabetes_data.py
      - name: Run software tests
        run: uv run python -m pytest -q
      - name: Replay frozen development tools
        run: uv run python -m alz_compass.verify --output /tmp/t2d-snapshot-replay.json
      - name: Verify local HTTP transport
        run: uv run python -m alz_compass.verify_http --output /tmp/t2d-http-check.json
